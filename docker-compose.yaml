services:
  mongo:
    image: mongo
    environment:
      MONGODB_INITDB_ROOT_USERNAME: user
      MONGODB_INITDB_ROOT_PASSWORD: pass
    ports:
      - 27017:27017

  processor:
    build: processor
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: user
      MONGO_PASSWORD: pass
    depends_on:
      - mongo
    
